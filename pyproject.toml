[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uns-to-lakehouse"
version = "0.1.0"
description = "A virtual factory and experiments for moving Unified Namespace (MQTT / Sparkplug B) data into an open lakehouse."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
bench = ["duckdb>=1.0"]
dev = ["pytest>=8", "duckdb>=1.0"]

[project.scripts]
unslake = "unslake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
